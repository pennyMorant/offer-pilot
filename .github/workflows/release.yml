name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          SDK_BIN="$(dirname "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)")"
          export PATH="$SDK_BIN:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CLEAN="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Run core unit tests
        run: ./gradlew :core:test --console=plain

      - name: Prepare signing and build APK
        id: build
        env:
          VERSION_NAME: ${{ steps.ver.outputs.version_name }}
          VERSION_CODE: ${{ steps.ver.outputs.version_code }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
            export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
            ./gradlew :app:assembleRelease --console=plain
            OUT="offer-pilot-${{ steps.ver.outputs.tag }}-release.apk"
            cp app/build/outputs/apk/release/app-release.apk "$OUT"
          else
            ./gradlew :app:assembleDebug --console=plain
            OUT="offer-pilot-${{ steps.ver.outputs.tag }}-debug.apk"
            cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          fi
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: OfferPilot ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.build.outputs.apk }}
